[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Força HTTPS e o domínio canônico (sem www)
[[redirects]]
  from = "http://nexlorn.com.br/*"
  to = "https://nexlorn.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.nexlorn.com.br/*"
  to = "https://nexlorn.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.nexlorn.com.br/*"
  to = "https://nexlorn.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[plugins]]
  package = "./netlify/plugins/indexnow"
